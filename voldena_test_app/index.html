<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Voldena Test App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e94560;
            text-align: center;
            padding: 50px;
        }
        h1 {
            font-size: 2.5rem;
            color: #0f3460;
            background-color: #e94560;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #fff;
            margin-top: 20px;
            line-height: 1.6;
        }
        .warning {
            border: 2px dashed #e94560;
            padding: 20px;
            margin-top: 30px;
            border-radius: 10px;
            background-color: rgba(233, 69, 96, 0.1);
        }
    </style>
</head>
<body>
    <h1>Voldena Test App Çalışıyor!</h1>
    
    <div class="warning">
        <p>Ben bir test uygulamasıyım.</p>
        <p>Şu an arkada gizlice <b>Regedit'e</b> (HKCU\Software\voldena_test_app) ve <b>AppData</b> klasörlerine çöp dosyalar bıraktım!</p>
        <p>Hadi durma, <b>Voldena Uninstaller</b> uygulamasını aç ve beni "Tamamen Yok Et" moduyla silmeyi dene!</p>
    </div>
</body>
</html>
